
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Administrador - LovePaws</title>

<style>
body {
	font-family: Arial, sans-serif;
	margin: 40px;
	background-color: #f5f6fa;
}

.contenedor {
	max-width: 1000px;
	margin: auto;
}

.estadisticas {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	gap: 20px;
	margin-top: 30px;
}

.card {
	background: white;
	padding: 25px;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.card h2 {
	font-size: 16px;
	color: #555;
}

.numero {
	font-size: 32px;
	font-weight: bold;
	color: #333;
}

button {
	padding: 10px 18px;
	cursor: pointer;
}
</style>
</head>

<body>

	<main class="contenedor">

		<h1>Dashboard de Administrador</h1>

		<p>Bienvenido al panel administrativo de LovePaws.</p>

		<section class="estadisticas">

			<article class="card">
				<h2>Usuarios registrados</h2>

				<p class="numero" th:text="${resumen.totalUsuarios}">0</p>
			</article>

			<article class="card">
				<h2>Mascotas registradas</h2>

				<p class="numero" th:text="${resumen.totalMascotas}">0</p>
			</article>

			<article class="card">
				<h2>Solicitudes pendientes</h2>

				<p class="numero" th:text="${resumen.solicitudesPendientes}">0</p>
			</article>

			<article class="card">
				<h2>Reportes</h2>

				<p>Consulta el historial y las estadísticas de adopciones.</p>

				<p>Próximamente</p>
			</article>

		</section>

		<br>

		<form th:action="@{/logout}" method="post">
			<button type="submit">Cerrar sesión</button>
		</form>

	</main>

</body>
</html>
