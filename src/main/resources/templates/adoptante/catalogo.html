
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catálogo de mascotas - LovePaws</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-body-tertiary">

	<!-- Navegacion -->
	<nav class="navbar navbar-expand-lg bg-white border-bottom">
		<div class="container">

			<a class="navbar-brand fw-bold" th:href="@{/}"> LovePaws </a>

			<form th:action="@{/logout}" method="post">
				<button class="btn btn-outline-danger btn-sm" type="submit">
					Cerrar sesión</button>
			</form>

		</div>
	</nav>

	<!-- Catalogo -->
	<main class="container py-5">

		<div class="mb-4">
			<h1 class="fw-bold">Encuentra a tu compañero</h1>

			<p class="text-secondary">Conoce a las mascotas que esperan
				encontrar un hogar.</p>
		</div>

		<!-- Cuando no existen mascotas -->
		<div th:if="${#lists.isEmpty(mascotas)}" class="alert alert-info">

			Actualmente no hay mascotas disponibles para adopción.</div>

		<!-- Listado de mascotas -->
		<div th:unless="${#lists.isEmpty(mascotas)}"
			class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

			<div class="col" th:each="mascota : ${mascotas}">

				<article class="card h-100 shadow-sm border-0">

					<!-- Fotografia -->
					<img
						th:if="${mascota.fotoUrl != null and !#strings.isEmpty(mascota.fotoUrl)}"
						th:src="${mascota.fotoUrl}"
						th:alt="${'Fotografía de ' + mascota.nombre}" class="card-img-top"
						style="height: 220px; object-fit: cover;">

					<div
						th:unless="${mascota.fotoUrl != null and !#strings.isEmpty(mascota.fotoUrl)}"
						class="bg-secondary-subtle d-flex align-items-center justify-content-center"
						style="height: 220px;">

						<span class="text-secondary"> Sin fotografía </span>

					</div>

					<!-- Informacion -->
					<div class="card-body">

						<div
							class="d-flex justify-content-between align-items-center mb-2">

							<h5 class="card-title fw-bold mb-0" th:text="${mascota.nombre}">
								Max</h5>

							<span class="badge text-bg-success"> Disponible </span>

						</div>

						<p class="text-secondary mb-2">

							<span th:text="${mascota.tipoMascota}"> PERRO </span> <span
								th:if="${mascota.raza != null}"
								th:text="${' · ' + mascota.raza}"> · Mestizo </span> <span
								th:unless="${mascota.raza != null}"> · Raza no
								especificada </span>

						</p>

						<p class="card-text" th:if="${mascota.descripcion != null}"
							th:text="${mascota.descripcion}">Descripción de la mascota.</p>

						<div class="small text-secondary">

							<p class="mb-1">
								<strong>Edad:</strong> <span
									th:if="${mascota.edadAnios != null}"
									th:text="${mascota.edadAnios + ' años '}"> </span> <span
									th:if="${mascota.edadMeses != null}"
									th:text="${mascota.edadMeses + ' meses'}"> </span> <span
									th:if="${mascota.edadAnios == null and mascota.edadMeses == null}">
									No especificada </span>
							</p>

							<p class="mb-0">
								<strong>Sexo:</strong> <span th:if="${mascota.sexo != null}"
									th:text="${mascota.sexo}"> </span> <span
									th:unless="${mascota.sexo != null}"> No especificado </span>
							</p>

						</div>

					</div>

				</article>

			</div>

		</div>

	</main>

</body>
</html>
