
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gestor - LovePaws</title>

<style>
body {
	font-family: Arial, sans-serif;
	margin: 40px;
	background-color: #f5f6fa;
}

.contenedor {
	max-width: 1000px;
	margin: auto;
}

.estadisticas {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	gap: 20px;
	margin-top: 30px;
}

.card {
	background: white;
	padding: 25px;
	border-radius: 12px;
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.card h2 {
	font-size: 16px;
	color: #555;
}

.numero {
	font-size: 32px;
	font-weight: bold;
	color: #333;
}
</style>
</head>

<body>

	<main class="contenedor">

		<h1>Dashboard de Gestor</h1>

		<p>Resumen de tu actividad en LovePaws.</p>

		<section class="estadisticas">

			<article class="card">
				<h2>Mis mascotas</h2>

				<p class="numero" th:text="${resumen.totalMascotas}">0</p>
			</article>

			<article class="card">
				<h2>Mascotas disponibles</h2>

				<p class="numero" th:text="${resumen.mascotasDisponibles}">0</p>
			</article>

			<article class="card">
				<h2>Solicitudes pendientes</h2>

				<p class="numero" th:text="${resumen.solicitudesPendientes}">0</p>
			</article>

		</section>

		<br>

		<form th:action="@{/logout}" method="post">
			<button type="submit">Cerrar sesión</button>
		</form>

	</main>

</body>
</html>
