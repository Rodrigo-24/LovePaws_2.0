spring.application.name=LovePaws_2.0

spring.datasource.url=jdbc:mysql://localhost:3306/lovepaws_v2
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializacion del administrador
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nombres=${BOOTSTRAP_ADMIN_NOMBRES:}
app.bootstrap-admin.apellidos=${BOOTSTRAP_ADMIN_APELLIDOS:}

# Configuracion de carga de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB